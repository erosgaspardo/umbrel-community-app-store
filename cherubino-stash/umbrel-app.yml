manifestVersion: 1
id: cherubino-stash
storage:
  dataRoot: data
category: media
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/stash.webp
name: Stash
version: v0.31.1
tagline: Organize and browse your personal media collection
description:
  Stash is a self-hosted organizer for personal adult media. It scans your
  collection, manages metadata and images, and provides a rich browser-based UI with
  search, tagging, performers, scenes, galleries, and generated media.
developer: Stash Project
website: https://stashapp.cc/
dependencies: []
repo: https://github.com/stashapp/stash
support: https://github.com/stashapp/stash/issues
port: 9999
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes:
  Packaged against Stash v0.31.1, the latest stable release verified on
  2026-09-23. This Docker image includes FFmpeg.
submitter: Cherubino
permissions:
  - STORAGE_DOWNLOADS
